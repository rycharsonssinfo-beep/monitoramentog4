name: Inspecionar layout do login v3.55
on:
  push:
    branches: [feature/login-redesign-saas-v355]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Listar apenas estrutura do login (sem segredos)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('main.py').read_text(encoding='utf-8').splitlines()
          markers=[
            'Painel de Monitoramento','Acesso ao Painel de Monitoramento',
            'Acesso ao painel de monitoramento','Permanecer conectado neste dispositivo',
            'Solicitar acesso','nome@empresa.com.br','Entrar no painel',
            'Usuário (e-mail)','Use o e-mail e a senha','login-card','login-hero',
            'login-container','auth-login','login-box','st.form(', 'def render_login',
            'def tela_login','def login_', 'auth-card','login-panel','login_title',
            'SS_OFICIAL_LOGO_DATA_URI','_mascot_sim_data_uri','COM_MASCOTE_AVISO_DATA_URI',
            'APP_VERSION ='
          ]
          for marker in markers:
            hits=[i for i,l in enumerate(lines) if marker.lower() in l.lower()]
            print(f'@@ FOUND {marker}: {len(hits)} {[x+1 for x in hits[:12]]}')
            for i in hits[:3]:
              print(f'@@ CONTEXT {marker} {i+1}')
              for k in range(max(0,i-12),min(len(lines),i+16)):
                t=lines[k].strip()
                if len(t)>500:t=t[:500]+' [truncated]'
                if any(x in t.lower() for x in ['password =','secret_key','service_role','access_token','refresh_token','supabase_secret','passwd','api_key','authorization:','b64_json','base64.b64encode']):t='[CONFIG PROTEGIDA]'
                print(f'{k+1}: {t}')
          PY