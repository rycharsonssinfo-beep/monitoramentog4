name: Etapa 1 — Otimização de desempenho (branch de validação)
on:
  push:
    branches:
      - "feature/etapa-1-performance-v3-52-0"
    paths:
      - "scripts/aplicar_etapa1_performance.py"
      - ".github/workflows/otimizar_etapa1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de desempenho
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar integridade do script
        run: python -m py_compile scripts/aplicar_etapa1_performance.py
      - name: Aplicar patch v3.52.0 com checagem de âncoras
        run: python scripts/aplicar_etapa1_performance.py
      - name: Verificar Python sem iniciar app
        run: |
          python -m py_compile main.py
          python -m py_compile pages/Mapa_de_Sistemas.py
          git diff --check
      - name: Verificar JavaScript da ponte de início
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          content = Path("main.py").read_text(encoding="utf-8")
          part = content.split('"ss_monitor_fast_start_v352"', 1)[1]
          js = part.split('js=r"""', 1)[1].split('"""', 1)[0]
          subprocess.run(["node", "--check", "--input-type=module", "-"], input=js, text=True, check=True)
          print("Ponte de início: JavaScript válido.")
          PY
      - name: Rodar testes existentes do mapa
        run: |
          node scripts/test_mapa_sistemas_auto_refresh.cjs
          node scripts/test_mapa_sistemas_ocorrencias.cjs
          node scripts/test_mapa_sistemas_status.cjs
          node scripts/test_mapa_sistemas_operacao.cjs
          node scripts/test_mapa_sistemas_report.cjs
      - name: Commit apenas na branch de validação
        run: |
          if git diff --quiet -- main.py; then
            echo "Etapa 1 já aplicada; nenhum arquivo modificado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py
            git commit -m "perf: etapa 1 acelerar login e início do monitor v3.52.0"
            git push origin HEAD:feature/etapa-1-performance-v3-52-0
          fi
