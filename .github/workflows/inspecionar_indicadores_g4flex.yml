name: Inspecionar pontos de integracao G4Flex indicadores
on:
  push:
    branches: [feature/g4flex-aba-indicadores]
    paths: [.github/workflows/inspecionar_indicadores_g4flex.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('main.py').read_text(encoding='utf-8').splitlines()
          keys=['function g4fStart(host)', 'function g4fRender()', 'function g4fChangeLayout(layout)', 'g4f-top-actions', 'g4f-board{', 'g4f-board{position', '.g4f-board{', '.g4f-board.g4f-ss-mode']
          print("FILE LEN",len(s))
          for i,l in enumerate(s):
              if any(k in l for k in keys):
                  print('HIT',i+1,l[:500])
          for a,b in [(11765,11828),(12345,12422),(9860,9898),(9960,9985)]:
              print('SECTION',a,b)
              for i in range(a-1,min(b,len(s))):
                  print(str(i+1)+': '+s[i][:560])
          PY
