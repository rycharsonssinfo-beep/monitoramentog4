name: Integrar Mapa de Sistemas no Monitor
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/integrar_mapa_sistemas.py"
      - ".github/workflows/integrar_mapa_sistemas.yml"
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Aplicar integração e validar sintaxe
        run: python scripts/integrar_mapa_sistemas.py
      - name: Publicar alteração somente se existir
        run: |
          if ! git diff --quiet -- main.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py
            git commit -m "feat: exibe Mapa de Sistemas no menu do Monitor"
            git push origin HEAD:main
          else
            echo "main.py já integrado ou sem modificações."
          fi
