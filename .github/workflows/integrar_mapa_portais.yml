name: Integrar mapa no Monitor de Portais S&S
on:
  push:
    paths:
      - "scripts/integrar_mapa_portais.py"
      - "scripts/ajustar_barra_monitor.py"
      - "scripts/mapa_sistemas_embed.js"
      - "scripts/mapa_sistemas_enhance.js"
      - "scripts/mapa_sistemas_enhance.css"
      - "scripts/mapa_sistemas_icones.css"
      - "scripts/assets/mapa_portal_contribuinte.webp"
      - "scripts/assets/mapa_fluxus.webp"
      - "scripts/assets/mapa_veiculos.webp"
      - "scripts/logo_grupo_ss_oficial.js"
      - "scripts/mapa_sistemas_report.js"
      - "scripts/mapa_sistemas_report.css"
      - "scripts/mapa_sistemas_operacao.js"
      - "scripts/mapa_sistemas_operacao.css"
      - "scripts/mapa_sistemas_status.js"
      - "scripts/mapa_sistemas_status.css"
      - "scripts/mapa_sistemas_auto_refresh.js"
      - "scripts/mapa_sistemas_ocorrencias.js"
      - "scripts/mapa_sistemas_sync_ocorrencias.css"
      - "scripts/test_mapa_sistemas_auto_refresh.cjs"
      - "scripts/test_mapa_sistemas_ocorrencias.cjs"
      - "scripts/test_mapa_sistemas_status.cjs"
      - "scripts/test_mapa_sistemas_operacao.cjs"
      - "scripts/test_mapa_sistemas_report.cjs"
      - ".github/workflows/integrar_mapa_portais.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validar sintaxe do componente JavaScript
        run: |
          node --check scripts/mapa_sistemas_embed.js
          node --check scripts/mapa_sistemas_enhance.js
          node --check scripts/logo_grupo_ss_oficial.js
          node --check scripts/mapa_sistemas_report.js
          node --check scripts/mapa_sistemas_operacao.js
          node --check scripts/mapa_sistemas_status.js
          node --check scripts/mapa_sistemas_auto_refresh.js
          node --check scripts/mapa_sistemas_ocorrencias.js
          node --check scripts/test_mapa_sistemas_auto_refresh.cjs
          node --check scripts/test_mapa_sistemas_ocorrencias.cjs
          node --check scripts/test_mapa_sistemas_status.cjs
          node --check scripts/test_mapa_sistemas_operacao.cjs
      - name: Testar exportação XLSX, dados e prévia PDF
        run: node scripts/test_mapa_sistemas_report.cjs
      - name: Testar disponibilidade, cobertura e histórico
        run: node scripts/test_mapa_sistemas_operacao.cjs
      - name: Testar filtros clicáveis de status no mapa
        run: node scripts/test_mapa_sistemas_status.cjs
      - name: Testar atualização automática de 60 segundos
        run: node scripts/test_mapa_sistemas_auto_refresh.cjs
      - name: Testar painel municipal de ocorrências
        run: node scripts/test_mapa_sistemas_ocorrencias.cjs
      - name: Validar integrador de ícones Python
        run: python -m py_compile scripts/integrar_mapa_portais.py
      - name: Aplicar mapa no painel e validar Python
        run: python scripts/integrar_mapa_portais.py
      - name: Ajustar barra superior e validar HTML do monitor
        run: |
          python -m py_compile scripts/ajustar_barra_monitor.py
          python scripts/ajustar_barra_monitor.py
          python scripts/ajustar_barra_monitor.py --check
          python - <<'PY'
          from pathlib import Path
          import subprocess
          src = Path("main.py").read_text(encoding="utf-8")
          block = src.split("    html_painel = r'''", 1)[1].split("\n    '''", 1)[0]
          js = block.split("<script>", 1)[1].split("</script>", 1)[0]
          subprocess.run(["node", "--check", "-"], input=js, text=True, check=True)
          print("HTML do Monitor: JavaScript válido.")
          PY
      - name: Publicar ajuste restrito ao main.py
        run: |
          if ! git diff --quiet -- main.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py
            git commit -m "fix: barra superior do Monitor somente na borda sem redimensionar painéis"
            git push origin HEAD:main
          else
            echo "Mapa já integrado; sem alterações."
          fi
