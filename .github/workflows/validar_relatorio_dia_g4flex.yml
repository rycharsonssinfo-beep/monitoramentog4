name: Validar ranking de filas e relatorio do dia
on:
  push:
    branches: [feature/g4flex-ranking-filas-relatorio-dia]
    paths:
      - scripts/g4flex_indicadores.js
      - scripts/g4flex_relatorio_dia.js
      - scripts/g4flex_indicadores.css
      - scripts/integrar_g4flex_indicadores.py
      - scripts/test_g4flex_relatorio_dia.cjs
      - .github/workflows/validar_relatorio_dia_g4flex.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar scripts e montar main.py
        run: |
          node --check scripts/g4flex_indicadores.js
          node --check scripts/g4flex_relatorio_dia.js
          node --check scripts/g4flex_tooltip_filas.js
          node scripts/test_g4flex_indicadores.cjs
          node scripts/test_g4flex_relatorio_dia.cjs
          python scripts/integrar_g4flex_indicadores.py
          python -m py_compile main.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('main.py').read_text(encoding='utf-8')
          assert s.count('function g4fReportQueues(row)')==1
          assert s.count('function g4fDailyReportHTML(row)')==1
          assert s.count('function g4fExportDailyReport(row)')==1
          assert s.count('data-g4f-report-daily')>=2
          assert s.count('function g4fQueueTooltipInit(host)')==1
          assert s.count('setInterval(g4fPoll,3000)')==1
          assert 'Ranking de filas</h3>' in s
          print('OK: Ranking de filas, botão Relatório do dia, sem novas requisições.')
          PY
      - name: Commit main.py na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- main.py; then
            git add main.py
            git commit -m "feat: ranking de filas e relatório do dia no Monitor G4Flex"
            git push origin HEAD:feature/g4flex-ranking-filas-relatorio-dia
          fi
