name: Integrar alertas com mascote v3.53.0 (validação)
on:
  push:
    branches:
      - "feature/alertas-portais-mascote-v3-53-0"
    paths:
      - "integrar_alertas_v353.py"
      - "portal_alerts_v353.js"
      - "scripts/test_portal_alerts_v353.cjs"
      - ".github/workflows/integrar_alertas_v353.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrar-e-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar código dos alertas
        run: |
          python -m py_compile integrar_alertas_v353.py
          node --check portal_alerts_v353.js
          node scripts/test_portal_alerts_v353.cjs
      - name: Integrar ao main.py da raiz
        run: python integrar_alertas_v353.py
      - name: Verificar sintaxe do aplicativo e integridade da alteração
        run: |
          python -m py_compile main.py
          python - <<'PY'
          from pathlib import Path
          text=Path("main.py").read_text(encoding="utf-8")
          assert text.count('window.ssPortalAlerts353.start({')==1
          assert text.count("window.ssPortalAlerts353?.receive(data)") == 1
          assert text.count("window.ssPortalAlerts353?.mount(host") == 1
          print("OK: inicialização, coleta e interface integradas uma única vez")
          PY
          git diff --check
      - name: Testes existentes do Mapa de Sistemas
        run: |
          node scripts/test_mapa_sistemas_auto_refresh.cjs
          node scripts/test_mapa_sistemas_ocorrencias.cjs
          node scripts/test_mapa_sistemas_status.cjs
          node scripts/test_mapa_sistemas_operacao.cjs
          node scripts/test_mapa_sistemas_report.cjs
      - name: Commit da integração somente nesta branch
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py já integrado; não há nova modificação."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py
            git commit -m "feat: integrar alertas visuais e sonoros v3.53.0 no main.py"
            git push origin HEAD:feature/alertas-portais-mascote-v3-53-0
          fi
