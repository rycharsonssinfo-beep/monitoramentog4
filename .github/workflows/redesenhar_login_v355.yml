name: Validar e integrar redesign de login v3.55
on:
  push:
    branches: [feature/login-redesign-saas-v355]
    paths:
      - scripts/redesenhar_login_v355.py
      - .github/workflows/redesenhar_login_v355.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar atualização e validar Python
        run: |
          python scripts/redesenhar_login_v355.py
          python -m py_compile main.py
          python scripts/redesenhar_login_v355.py
          git diff --check
      - name: Validar formulário e recursos preservados
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("main.py").read_text(encoding="utf-8")
          start=s.index("def _render_login_gate():")
          end=s.index("def _render_account_sidebar():",start)
          gate=s[start:end]
          assert 'APP_VERSION = "3.55.0"' in s
          assert gate.count("login_hero_col, login_form_col = st.columns(")==1
          assert gate.count("with login_form_col:")==1
          assert gate.count("with login_hero_col:")==1
          assert gate.count('monitor_auth_login')==1
          assert gate.count('monitor_request_access_v336')==1
          assert gate.count('_auth_login(email, password)')==1
          assert 'Permanecer conectado neste dispositivo' in gate
          assert 'Solicitar acesso' in gate
          assert '_monitor_render_formspree_browser_form()' in gate
          assert 'st.session_state["_monitor_auth_remember_v342"]' in gate
          assert 'LOGIN_HERO_B64' in s
          assert '.auth-features' in s
          assert '@media (max-width: 600px)' in s
          assert 'def _render_set_password(' in s
          assert 'def _auth_logout(' in s
          assert "auth-view" not in gate
          print("OK: autenticação original, alternância de acesso, persistência e responsividade preservadas.")
          PY
      - name: Regressão do monitor
        run: |
          node --check portal_alerts_v353.js
          node scripts/test_portal_alerts_v353.cjs
          node scripts/test_portal_alerts_homologacao_v353.cjs
          node scripts/test_mapa_sistemas_status.cjs
          node scripts/test_mapa_sistemas_auto_refresh.cjs
      - name: Publicar alteração apenas na branch
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py já está atualizado"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.py
            git commit -m "ui: login premium responsivo Monitor S&S v3.55"
            git push origin HEAD:feature/login-redesign-saas-v355
          fi
